# 仅用于把 DATABASE_URL 从默认的 SQLite 切到 Postgres：
#   docker compose up -d
#   uv sync --extra postgres          # 安装 psycopg 驱动
#   DATABASE_URL=postgresql+psycopg://postgres:postgres@127.0.0.1:5432/shopping_agent
# 应用本身（FastAPI）默认直跑，不在此编排中。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopping_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
