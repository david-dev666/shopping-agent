name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check app tests scripts eval migrations

      - name: Test (pytest)
        run: uv run pytest -q

      - name: Build and verify installed wheel
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/shopping-dist"
          uv pip install --no-deps --target "$RUNNER_TEMP/shopping-package" "$RUNNER_TEMP"/shopping-dist/*.whl
          .venv/bin/python scripts/smoke_install.py --package-root "$RUNNER_TEMP/shopping-package"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend logic and syntax
        working-directory: .
        run: |
          node --check backend/static/app.js
          node --check backend/static/stream.mjs
          node --test frontend/tests/*.test.mjs
