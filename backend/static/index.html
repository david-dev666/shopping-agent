<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>shopping-agent 跨平台比价</title>
<style>
  :root {
    --bg: #f6f7fb; --card: #fff; --text: #1a1f36; --muted: #8b91a5;
    --jd: #e1251b; --jd-bg: #fff1f0; --taobao: #ff6a00; --taobao-bg: #fff7ec;
    --pdd: #e02e24; --pdd-bg: #fff1f2; --accent: #4f6ef7; --accent-dark: #3b5bdb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  .container { max-width: 920px; margin: 0 auto; padding: 40px 20px 80px; }

  /* 头部 */
  .hero { text-align: center; margin-bottom: 28px; }
  .hero h1 { font-size: 28px; letter-spacing: -0.5px; }
  .hero h1 span { color: var(--accent); }
  .hero p { color: var(--muted); font-size: 14px; margin-top: 6px; }

  /* 模式切换 */
  .mode-tabs { display: flex; gap: 4px; background: #eceff8; border-radius: 11px; padding: 4px; margin-bottom: 16px; width: fit-content; }
  .mt-btn { border: none; background: transparent; padding: 8px 18px; font-size: 13.5px; border-radius: 8px; cursor: pointer; color: var(--muted); }
  .mt-btn.on { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.08); }

  /* Agent 回答 */
  .agent-answer { margin-bottom: 20px; }
  .aa-head { display: flex; gap: 12px; align-items: flex-start; }
  .aa-avatar { font-size: 28px; background: #eef1fb; border-radius: 12px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .aa-bubble { background: var(--card); border-radius: 4px 16px 16px 16px; padding: 16px 18px; font-size: 14px; line-height: 1.7; box-shadow: 0 2px 10px rgba(26,31,54,.06); white-space: pre-wrap; }
  .aa-meta { display: flex; gap: 8px; align-items: center; margin-top: 10px; padding-left: 56px; flex-wrap: wrap; }
  .aa-link { font-size: 12.5px; color: var(--accent); cursor: pointer; }
  .aa-link-strong {
    color: var(--accent-dark); font-weight: 600; text-decoration: none;
    border-bottom: 2px solid #adc6ff; word-break: break-all;
  }
  .aa-link-strong:hover { background: #f0f5ff; }

  /* Agent 首选高亮卡 */
  .top-pick {
    display: flex; align-items: center; gap: 14px; margin: 14px 0 6px 56px;
    background: linear-gradient(135deg, #fff, #f6f8ff); border: 2px solid var(--accent);
    border-radius: 14px; padding: 14px 18px; box-shadow: 0 4px 16px rgba(79,110,247,.15);
  }
  .top-pick.jd { border-color: var(--jd); box-shadow: 0 4px 16px rgba(225,37,27,.15); }
  .top-pick.taobao { border-color: var(--taobao); box-shadow: 0 4px 16px rgba(255,106,0,.15); }
  .top-pick.pdd { border-color: var(--pdd); box-shadow: 0 4px 16px rgba(224,46,36,.15); }
  .tp-left { flex: 1; min-width: 0; }
  .tp-label { font-size: 12px; font-weight: 700; color: var(--accent-dark); margin-left: 6px; }
  .top-pick.jd .tp-label { color: var(--jd); }
  .top-pick.taobao .tp-label { color: var(--taobao); }
  .top-pick.pdd .tp-label { color: var(--pdd); }
  .tp-shop { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .tp-price { color: #cf1322; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tp-price .yen { font-size: 15px; }
  .tp-buy {
    padding: 10px 22px; border-radius: 10px; font-size: 14px; font-weight: 700; color: #fff;
    text-decoration: none; background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    box-shadow: 0 2px 8px rgba(79,110,247,.3);
  }
  .tp-buy:hover { opacity: .88; }

  /* Trace 时间线 */
  .trace-panel { background: var(--card); border-radius: 14px; padding: 18px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(26,31,54,.05); }
  .tp-title { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
  .tp-steps { display: flex; flex-direction: column; }
  .tp-step { display: flex; gap: 12px; }
  .tp-rail { display: flex; flex-direction: column; align-items: center; width: 34px; flex-shrink: 0; }
  .tp-icon { width: 34px; height: 34px; background: #eef1fb; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .tp-line { width: 2px; flex: 1; background: #dfe3ee; min-height: 14px; margin: 4px 0; }
  .tp-body { flex: 1; padding-bottom: 18px; min-width: 0; }
  .tp-head { display: flex; justify-content: space-between; align-items: baseline; }
  .tp-head b { font-size: 13.5px; }
  .tp-time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tp-desc { font-size: 12px; color: var(--muted); margin: 2px 0 8px; }
  .tp-io { font-size: 12px; margin: 2px 0; color: #5c6274; word-break: break-all; }
  .tp-io .tp-in, .tp-io .tp-out { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; margin-right: 6px; font-weight: 600; }
  .tp-io .tp-in { background: #f0f5ff; color: #1d39c4; }
  .tp-io .tp-out { background: #f6ffed; color: #389e0d; }
  .tp-detail summary { font-size: 11.5px; color: var(--muted); cursor: pointer; margin-top: 4px; }
  .tp-detail pre { font-size: 11px; background: #f6f7fb; border-radius: 8px; padding: 10px; margin-top: 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; max-height: 260px; overflow-y: auto; }

  /* 搜索 */
  .search-bar {
    display: flex; gap: 10px; margin-bottom: 20px;
    background: var(--card); padding: 10px; border-radius: 16px;
    box-shadow: 0 4px 20px rgba(26,31,54,.06);
  }
  .search-bar input {
    flex: 1; padding: 12px 18px; font-size: 15px; border: none;
    border-radius: 10px; outline: none; background: #f6f7fb;
  }
  .search-bar input:focus { background: #eef1fb; }
  .search-bar button {
    padding: 12px 32px; font-size: 15px; font-weight: 600; border: none;
    border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff; cursor: pointer; transition: opacity .15s;
  }
  .search-bar button:hover { opacity: .9; }
  .search-bar button:disabled { opacity: .5; cursor: not-allowed; }

  /* 平台摘要 */
  .platform-summary {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px;
  }
  .p-card {
    background: var(--card); border-radius: 14px; padding: 16px;
    box-shadow: 0 2px 10px rgba(26,31,54,.04); position: relative; overflow: hidden;
  }
  .p-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .p-card.jd::before { background: var(--jd); }
  .p-card.taobao::before { background: var(--taobao); }
  .p-card.pdd::before { background: var(--pdd); }
  .p-name { font-size: 13px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .p-dot { width: 8px; height: 8px; border-radius: 50%; }
  .jd .p-dot { background: var(--jd); }
  .taobao .p-dot { background: var(--taobao); }
  .pdd .p-dot { background: var(--pdd); }
  .p-min { font-size: 24px; font-weight: 700; color: #cf1322; }
  .p-min .yen { font-size: 14px; }
  .p-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .p-cheapest { outline: 2px solid #ffa39e; }
  .best-flag {
    position: absolute; top: 10px; right: 10px; font-size: 11px; padding: 2px 8px;
    border-radius: 999px; background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e;
  }
  .agent-summary-head { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin-bottom: 10px; }
  .agent-summary-head strong { color: #4a5069; font-weight: 600; }
  .p-name .p-kind { margin-left: auto; font-size: 10.5px; font-weight: 600; color: var(--accent-dark); }
  .p-title {
    font-size: 12.5px; line-height: 1.4; margin-top: 6px; color: #5c6274;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .p-why { font-size: 11.5px; color: var(--muted); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 工具行 */
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .toolbar .count { font-size: 13px; color: var(--muted); }
  .tabs { display: flex; gap: 4px; background: #eceff8; border-radius: 9px; padding: 3px; }
  .tabs button {
    border: none; background: transparent; padding: 6px 14px; font-size: 13px;
    border-radius: 7px; cursor: pointer; color: var(--muted);
  }
  .tabs button.on { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.08); }

  /* 通知条 */
  .notice {
    background: #fffbe6; border: 1px solid #ffe58f; color: #ad6800;
    border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px;
  }
  .notice.err { background: #fff1f0; border-color: #ffa39e; color: #cf1322; }

  /* 结果卡片 */
  .card {
    position: relative; background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 10px;
    display: flex; gap: 14px; align-items: stretch;
    box-shadow: 0 1px 4px rgba(26,31,54,.05); transition: box-shadow .15s, transform .15s;
  }

  /* AI 排名徽章：左上角悬浮 */
  .rank-badge {
    position: absolute; top: -8px; left: -8px; z-index: 2;
    background: #5c6274; color: #fff; font-size: 12px; font-weight: 700;
    padding: 3px 10px; border-radius: 999px; box-shadow: 0 2px 6px rgba(0,0,0,.18);
  }
  .rank-badge.first { background: linear-gradient(135deg, #cf1322, #a8071a); }

  /* 综合分值环 */
  .score-ring {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 64px; flex-shrink: 0; border-radius: 14px; padding: 8px 4px;
    border: 2px solid; background: #fff;
  }
  .score-ring.high { border-color: #389e0d; background: #f6ffed; }
  .score-ring.mid { border-color: #d4b106; background: #fffbe6; }
  .score-ring.low { border-color: #d9d9d9; background: #fafafa; }
  .score-num { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .score-ring.high .score-num { color: #389e0d; }
  .score-ring.mid .score-num { color: #d48806; }
  .score-ring.low .score-num { color: #8b91a5; }
  .score-unit { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .card:hover { box-shadow: 0 6px 20px rgba(26,31,54,.1); transform: translateY(-1px); }
  .card.is-best { border: 1.5px solid #ffa39e; }
  .card img {
    width: 84px; height: 84px; object-fit: cover; border-radius: 10px;
    background: #f2f3f7; flex-shrink: 0;
  }
  .card .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .card .title {
    font-size: 14px; line-height: 1.45; max-height: 42px; overflow: hidden;
    margin-bottom: 8px; flex: 1;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag {
    font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 500;
    border: 1px solid transparent; white-space: nowrap;
  }
  .tag.jd { background: var(--jd-bg); color: var(--jd); border-color: #ffccc7; }
  .tag.taobao { background: var(--taobao-bg); color: var(--taobao); border-color: #ffd591; }
  .tag.pdd { background: var(--pdd-bg); color: var(--pdd); border-color: #ffccc7; }
  .tag.self { background: #f0f5ff; color: #1d39c4; border-color: #adc6ff; }
  .tag.flagship { background: #f6ffed; color: #389e0d; border-color: #b7eb8f; }
  .tag.subsidy { background: #fff0f6; color: #c41d7f; border-color: #ffadd2; }
  .tag.coupon { background: #fff1f0; color: #cf1322; border-color: #ffa39e; }
  .tag.sales { background: #f5f5f5; color: #8b91a5; border-color: #e3e5ec; }
  .tag.best { background: #cf1322; color: #fff; }
  .tag.ai { background: #f9f0ff; color: #531dab; border-color: #d3adf7; }
  .fb-btn {
    margin-top: 6px; border: none; background: transparent; color: #b3b8c8;
    font-size: 11px; cursor: pointer; padding: 0; text-decoration: underline dotted;
  }
  .fb-btn:hover { color: #cf1322; }
  .shop { color: var(--muted); font-size: 12px; }

  .price-box { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; }
  .price { color: #cf1322; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .price .yen { font-size: 14px; }
  .origin { color: #c6cad8; font-size: 12px; text-decoration: line-through; }
  .buy {
    margin-top: 8px; text-align: center; font-size: 12px; font-weight: 600; color: #fff;
    text-decoration: none; border-radius: 8px; padding: 6px 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  }
  .buy:hover { opacity: .9; }

  /* 分组标题 */
  .group-title {
    display: flex; align-items: center; gap: 8px; margin: 22px 0 10px;
    font-size: 15px; font-weight: 600;
  }
  .group-title::after { content: ""; flex: 1; height: 1px; background: #e3e5ec; }

  /* 平台筛选 */
  .platform-filter { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .pf-btn {
    border: 1px solid #e3e5ec; background: var(--card); color: #5c6274;
    padding: 6px 16px; font-size: 13px; border-radius: 999px; cursor: pointer;
    transition: all .15s;
  }
  .pf-btn:hover { border-color: #c4c9d9; }
  .pf-btn.on { background: #1a1f36; color: #fff; border-color: #1a1f36; font-weight: 600; }
  .pf-btn.on.pf-jd { background: var(--jd); border-color: var(--jd); }
  .pf-btn.on.pf-taobao { background: var(--taobao); border-color: var(--taobao); }
  .pf-btn.on.pf-pdd { background: var(--pdd); border-color: var(--pdd); }
  .pf-btn.spec.on { background: #531dab; border-color: #531dab; }
  .pf-n { opacity: .7; font-size: 11px; margin-left: 2px; }

  /* 结果头部 + 筛选面板 */
  .toolbar-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
  .toolbar-head .count { font-size: 13px; color: var(--muted); }
  .filter-panel {
    background: var(--card); border: 1px solid #e9ecf5; border-radius: 14px;
    padding: 14px 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(26,31,54,.04);
  }
  .fp-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .fp-title { font-size: 13.5px; font-weight: 700; }
  .fp-active {
    font-size: 11.5px; font-weight: 600; color: var(--accent-dark);
    background: #f0f5ff; border: 1px solid #adc6ff; border-radius: 999px; padding: 1px 9px;
  }
  .fp-reset {
    margin-left: auto; border: none; background: transparent; color: var(--muted);
    font-size: 12.5px; cursor: pointer; text-decoration: underline dotted;
  }
  .fp-reset:hover { color: var(--accent-dark); }
  .fp-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 0; border-top: 1px dashed #eef0f6; }
  .fp-label { font-size: 12px; color: var(--muted); width: 34px; flex-shrink: 0; }
  .fp-foot { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding-top: 12px; border-top: 1px solid #eef0f6; flex-wrap: wrap; }
  .fp-apply {
    border: none; cursor: pointer; padding: 9px 20px; border-radius: 10px; font-size: 13.5px; font-weight: 600;
    color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    box-shadow: 0 2px 8px rgba(79,110,247,.28);
  }
  .fp-apply:hover { opacity: .9; }
  .fp-apply:disabled { opacity: .55; cursor: not-allowed; }
  .fp-hint { font-size: 12.5px; color: var(--muted); }

  /* 价格滑块：双滑杆区间选择 */
  .price-slider {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
  }
  .ps-label { font-size: 12px; color: var(--muted); flex-shrink: 0; }
  .ps-vals { font-size: 13px; font-weight: 600; color: #cf1322; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .ps-vals .sep { color: var(--muted); font-weight: 400; margin: 0 3px; }
  .ps-track {
    position: relative; flex: 1; height: 28px; min-width: 180px; max-width: 340px;
    display: flex; align-items: center;
  }
  .ps-rail {
    position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px; background: #e3e5ec;
  }
  .ps-fill {
    position: absolute; height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-dark)); pointer-events: none;
  }
  .ps-thumb {
    position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #fff;
    border: 2.5px solid var(--accent); box-shadow: 0 1px 5px rgba(79,110,247,.35);
    cursor: grab; z-index: 2; transition: transform .1s; touch-action: none;
  }
  .ps-thumb:hover { transform: scale(1.15); }
  .ps-thumb:active { cursor: grabbing; transform: scale(1.25); }

  /* 排除标签（软规则警示） */
  .pf-btn.warn { border-color: #ffd591; color: #ad6800; background: #fffbe6; }
  .pf-btn.warn.excluded { background: #f5f5f5; color: #8b91a5; text-decoration: line-through; border-color: #d9d9d9; }
  .tag.warn { background: #fffbe6; color: #ad6800; border: 1px solid #ffd591; }

  /* 已过滤区 */
  .filtered-block { margin-top: 32px; }
  .filtered-toggle {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    background: var(--card); border: none; border-radius: 12px; padding: 14px 18px;
    font-size: 13px; color: var(--muted); cursor: pointer;
    box-shadow: 0 1px 4px rgba(26,31,54,.05);
  }
  .filtered-toggle .arrow { transition: transform .2s; }
  .filtered-toggle.open .arrow { transform: rotate(180deg); }
  .filtered-list { display: none; margin-top: 10px; }
  .filtered-list.show { display: block; }
  .filtered-item {
    display: flex; gap: 12px; align-items: center; background: var(--card);
    border-radius: 10px; padding: 10px 14px; margin-bottom: 6px; opacity: .75;
  }
  .filtered-item .f-title { flex: 1; font-size: 13px; color: #5c6274; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .filtered-item .f-price { font-size: 13px; color: #8b91a5; }
  .tag.reason { background: #f5f5f5; color: #5c6274; border-color: #e3e5ec; }

  .empty { text-align: center; color: var(--muted); padding: 70px 0; font-size: 14px; }
  .skel { height: 90px; border-radius: 14px; margin-bottom: 10px; background: linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
</style>
</head>
<body>
<div class="container">
  <div class="hero">
    <h1>shopping<span>-agent</span></h1>
    <p>京东 · 淘宝 · 拼多多 一次性比价，自动标注二手 / 杂牌 / 配件（可一键排除）</p>
  </div>

  <div class="mode-tabs">
    <button class="mt-btn on" id="mode-agent" onclick="setMode('agent')">Agent 决策 🤖</button>
    <button class="mt-btn" id="mode-compare" onclick="setMode('compare')">直接比价</button>
  </div>

  <div class="search-bar">
    <input id="q" placeholder="输入商品名或需求，例如：小米手环9 / 预算300买什么手环" />
    <button id="btn">问 Agent</button>
  </div>

  <div id="agent-answer"></div>
  <div id="trace-panel"></div>
  <div id="summary"></div>
  <div id="notice"></div>
  <div id="toolbar"></div>
  <div id="results"></div>
  <div id="filtered"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const PLATFORM = {
  jd:     { name: "京东",   cls: "jd" },
  taobao: { name: "淘宝",   cls: "taobao" },
  pdd:    { name: "拼多多", cls: "pdd" },
};
let sortMode = "ai"; // price | ai
let aiRank = null; // {items: [{index, score, reason}], summary}
let platformFilter = "all"; // all | jd | taobao | pdd
let specFilter = "all"; // all | 规格名
let lastSpecs = {}; // {规格名: [platform_id...]}
let excludedTags = new Set(); // 被排除的标签（疑似二手/价格异常/销量过低）
let priceRange = [null, null]; // 价格区间 [min, max]，null 为不限
let mode = "agent"; // compare | agent

window.setMode = (m) => {
  mode = m;
  document.querySelectorAll(".mt-btn").forEach((b) => b.classList.toggle("on", b.id === `mode-${m}`));

async function runAgent(q) {
  const btn = $("#btn");
  btn.disabled = true; btn.textContent = "Agent 思考中…";
  ["#agent-answer", "#trace-panel", "#summary", "#notice", "#toolbar", "#filtered"].forEach(
    (s) => ($(s).innerHTML = "")
  );
  $("#results").innerHTML = '<div class="skel"></div><div class="skel"></div>';
  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: q }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || `HTTP ${resp.status}`);
    }
    const d = await resp.json();
    // agent 决策与综合推荐同源：直接复用 decide 节点的排序
    if (d.rank_items && d.rank_items.length) {
      aiRank = { items: d.rank_items, summary: d.decision?.reason || "" };
      sortMode = "ai";
    }
    renderAgentAnswer(d);
    renderTrace(d.trace || []);
    renderErrors(d.errors);
    renderDemoBanner(d);
    renderAgentSummary(d.offers, d.rank_items);
    renderToolbar(d);
    renderResults(d.offers);
    window.__lastData = d;
    window.__base = d;
    window.__lastQuery = q;
  } catch (err) {
    $("#results").innerHTML = `<div class="empty">Agent 执行失败：${escapeHtml(err.message)}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = "问 Agent";
  }
}

/* 标签推导：从 shop / title 提取品质标签 */
function tagsOf(o, isBest) {
  const tags = [];
  const p = PLATFORM[o.platform];
  if (p) tags.push(`<span class="tag ${p.cls}">${p.name}</span>`);
  const shop = o.shop || "";
  const title = o.title || "";
  if (/京东自营|自营/.test(shop)) tags.push(`<span class="tag self">自营 · 品质保障</span>`);
  if (/旗舰店/.test(shop)) tags.push(`<span class="tag flagship">旗舰店 · 官方正品</span>`);
  if (/百亿补贴/.test(title + shop)) tags.push(`<span class="tag subsidy">百亿补贴</span>`);
  if (o.coupon) tags.push(`<span class="tag coupon">券 ¥${o.coupon}</span>`);
  if (isBest) tags.push(`<span class="tag best">全场最低</span>`);
  // 销量优先用后端结构化字段（webbridge / 联盟 API 解析值），文本正则兜底
  const sales = o.sales != null ? `已售 ${fmtSales(o.sales)} 件` : extractSales(title, shop);
  if (sales) tags.push(`<span class="tag sales">${sales}</span>`);
  return tags.join("");
}

function fmtSales(n) {
  if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, "") + "亿";
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, "") + "万";
  return String(n);
}

function extractSales(title, shop) {
  const m = (shop + " " + title).match(/(已售|总售|付款)[\s]*([\d.,]+\s*[万亿千百]*)\+?(人|件)?/);
  if (m) return `${m[1]}${m[2]}${m[3] || ""}`;
  const m2 = (shop + " " + title).match(/([\d.,]+)\s*([万千百])?\+?\s*(人付款|人收货|件)/);
  if (m2) return `${m2[1]}${m2[2] || ""}+ ${m2[3]}`;
  return null;
}

/* Agent 决策模式：三平台各自「综合最值得买」的一条（来自 decide 节点排序，非该平台最低价） */
function renderAgentSummary(offers, rankItems) {
  if (!offers.length) return;
  const meta = new Map();
  (rankItems || []).forEach((it, i) => meta.set(it.index, { rank: i + 1, score: it.score, reason: it.reason }));
  const counts = {};
  offers.forEach((o) => (counts[o.platform] = (counts[o.platform] || 0) + 1));
  // 每个平台取综合排名最靠前（rank 最小）的一条
  const picked = {};
  offers.forEach((o, idx) => {
    const it = meta.get(idx);
    const rank = it ? it.rank : Infinity;
    if (!picked[o.platform] || rank < picked[o.platform].rank) {
      picked[o.platform] = { o, rank, score: it?.score, reason: it?.reason };
    }
  });
  const list = Object.values(picked).sort((a, b) => a.rank - b.rank);
  if (!list.length) return;
  const topRank = list[0].rank;
  $("#summary").innerHTML = `
    <div class="agent-summary-head">
      各平台综合推荐 · Agent 按<strong>到手价 / 店铺可信度 / 销量 / 规格匹配</strong>综合权衡，
      给每个平台挑出<strong>最值得买的一条</strong>（不是该平台最低价）
    </div>
    <div class="platform-summary">${list.map(({ o, rank, score, reason }) => {
      const p = PLATFORM[o.platform];
      const isTop = rank === topRank;
      const scoreTxt = score != null && score > 0 ? `综合分 ${score}` : "综合分 —";
      return `
      <div class="p-card ${p.cls} ${isTop ? "p-cheapest" : ""}" title="${escapeHtml(o.title)}">
        ${isTop ? '<span class="best-flag">Agent 首选</span>' : ""}
        <div class="p-name"><span class="p-dot"></span>${p.name}<span class="p-kind">本平台首选</span></div>
        <div class="p-min"><span class="yen">¥</span>${o.price.toFixed(2)}</div>
        <div class="p-title">${escapeHtml(o.title)}</div>
        <div class="p-why">${scoreTxt} · 综合排名 #${rank} · 本平台 ${counts[o.platform]} 条报价${reason ? " · " + escapeHtml(reason) : ""}</div>
      </div>`;
    }).join("")}</div>`;
}

let psState = { min: 0, max: 0 };

function fmtNum(n) {
  return n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, "") + "万" : String(n);
}

function renderPriceSlider(offers) {
  if (offers.length < 4) return "";
  const prices = offers.map((o) => o.price);
  const min = Math.floor(Math.min(...prices)), max = Math.ceil(Math.max(...prices));
  if (min === max) return "";
  psState = { min, max };
  const [lo, hi] = priceRange;
  const curLo = lo ?? min, curHi = hi ?? max;
  const pct = (v) => (max > min ? ((v - min) / (max - min)) * 100 : 0);
  const loP = pct(curLo), hiP = pct(curHi);
  return `
  <div class="fp-row">
    <span class="fp-label">价格</span>
    <span class="ps-vals"><span id="ps-lo-v">¥${fmtNum(curLo)}</span><span class="sep">—</span><span id="ps-hi-v">¥${fmtNum(curHi)}</span></span>
    <div class="ps-track" id="ps-track">
      <div class="ps-rail"></div>
      <div class="ps-fill" style="left:${loP}%;width:${hiP - loP}%"></div>
      <div class="ps-thumb" id="ps-thumb-lo" style="left:calc(${loP}% - 9px)"></div>
      <div class="ps-thumb" id="ps-thumb-hi" style="left:calc(${hiP}% - 9px)"></div>
    </div>
  </div>`;
}

function psSync() {
  const track = document.getElementById("ps-track");
  if (!track) return;
  const { min, max } = psState;
  const [lo, hi] = priceRange[0] == null ? [min, max] : priceRange;
  const pct = (v) => (max > min ? ((v - min) / (max - min)) * 100 : 0);
  const loP = pct(lo), hiP = pct(hi);
  const tlo = document.getElementById("ps-thumb-lo");
  const thi = document.getElementById("ps-thumb-hi");
  const fill = document.querySelector("#ps-track .ps-fill");
  if (!tlo || !thi || !fill) return;
  tlo.style.left = `calc(${loP}% - 9px)`;
  thi.style.left = `calc(${hiP}% - 9px)`;
  fill.style.left = loP + "%";
  fill.style.width = (hiP - loP) + "%";
  document.getElementById("ps-lo-v").textContent = "¥" + fmtNum(lo);
  document.getElementById("ps-hi-v").textContent = "¥" + fmtNum(hi);
}

(function psInitDrag() {
  let dragTarget = null;
  document.addEventListener("mousedown", (e) => {
    const t = e.target.closest(".ps-thumb");
    if (t) { dragTarget = t; e.preventDefault(); }
  });
  document.addEventListener("touchstart", (e) => {
    const t = e.target.closest(".ps-thumb");
    if (t) dragTarget = t;
  }, { passive: true });
  const onMove = (e) => {
    if (!dragTarget) return;
    const track = document.getElementById("ps-track");
    if (!track) return;
    e.preventDefault();
    const rect = track.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const ratio = Math.min(1, Math.max(0, x / rect.width));
    const v = Math.round(psState.min + ratio * (psState.max - psState.min));
    let [lo, hi] = priceRange[0] == null ? [psState.min, psState.max] : priceRange;
    if (dragTarget.id === "ps-thumb-lo") lo = Math.min(v, hi);
    else hi = Math.max(v, lo);
    priceRange = [lo, hi];
    psSync();
  };
  document.addEventListener("mousemove", onMove);
  document.addEventListener("touchmove", onMove, { passive: false });
  const onUp = () => {
    if (!dragTarget) return;
    dragTarget = null;
    renderToolbar(window.__lastData);
    renderResults(window.__lastData.offers);
  };
  document.addEventListener("mouseup", onUp);
  document.addEventListener("touchend", onUp);
})();

function renderTagExclude(offers) {
  // 汇总打标项，提供「排除」开关（点击后隐藏带该标签的商品）
  const counts = {};
  offers.forEach((o) => (o.tags || []).forEach((t) => (counts[t] = (counts[t] || 0) + 1)));
  const names = Object.keys(counts);
  if (!names.length) return "";
  return `
  <div class="fp-row">
    <span class="fp-label">标签</span>
    ${names.map((t) => `
      <button class="pf-btn warn ${excludedTags.has(t) ? "excluded" : ""}" data-t="${escapeHtml(t)}"
        onclick="toggleTagExclude('${escapeHtml(t)}')" title="点击排除带此标签的商品">
        ${escapeHtml(t)} ${counts[t]}${excludedTags.has(t) ? " ✕" : ""}
      </button>`).join("")}
  </div>`;
}

window.toggleTagExclude = (t) => {

/* 收集当前筛选条件，用于触发后端重排 */
function currentFilters() {
  return {
    platforms: platformFilter === "all" ? [] : [platformFilter],
    exclude_tags: [...excludedTags],
    spec: specFilter === "all" ? null : specFilter,
    price_min: priceRange[0],
    price_max: priceRange[1],
  };
}

/* 清空筛选；若已重排过，则还原到重排前的全量候选集 */
window.resetFilters = () => {
  platformFilter = "all";
  specFilter = "all";
  excludedTags = new Set();
  priceRange = [null, null];
  const base = window.__base;
  if (mode === "agent" && base && base.offers && base.offers.length) {
    window.__lastData = base;
    if (base.rank_items && base.rank_items.length) {
      aiRank = { items: base.rank_items, summary: (base.decision && base.decision.reason) || "" };
      sortMode = "ai";
    }
    renderAgentAnswer(base);
    renderTrace(base.trace || []);
    renderAgentSummary(base.offers, base.rank_items);
    renderToolbar(base);
    renderResults(base.offers);
    return;
  }
  renderToolbar(window.__lastData);
  renderResults(window.__lastData.offers);
};

/* 触发 Agent 重排：把筛选条件交给后端，在缩小后的候选集上重新决策与排序 */
window.applyRefine = async () => {
  const base = window.__base || window.__lastData;
  if (!base || !base.offers || !base.offers.length) return;
  const btn = document.getElementById("fp-apply");
  if (btn) { btn.disabled = true; btn.textContent = "Agent 重新筛选与排序中…"; }
  try {
    const resp = await fetch("/api/refine", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        query: window.__lastQuery || base.query,
        offers: base.offers,
        filters: currentFilters(),
        intent: base.intent || {},
      }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || `HTTP ${resp.status}`);
    }
    const d = await resp.json();
    if (!d.offers || !d.offers.length) {
      // 筛没了：保留上一次结果，否则筛选面板会随空结果一起消失，用户无法回调
      $("#notice").innerHTML =
        '<div class="notice err">当前筛选条件下没有报价，已保留上一次结果，放宽筛选后重试</div>'
        + $("#notice").innerHTML;
      renderToolbar(window.__lastData);
      return;
    }
    window.__lastData = d;
    if (d.rank_items && d.rank_items.length) {
      aiRank = { items: d.rank_items, summary: (d.decision && d.decision.reason) || "" };
      sortMode = "ai";
    }
    renderAgentAnswer(d);
    renderTrace(d.trace || []);
    renderErrors(d.errors || {});
    renderDemoBanner(d);
    renderAgentSummary(d.offers, d.rank_items);
    renderToolbar(d);
    renderResults(d.offers);
    $("#notice").innerHTML =
      `<div class="notice">✅ 已按筛选重新排序：保留 ${d.offers.length} 条（原 ${base.offers.length} 条）</div>`
      + $("#notice").innerHTML;
  } catch (err) {
    $("#notice").innerHTML =
      `<div class="notice err">重新排序失败：${escapeHtml(err.message)}（当前仍为客户端筛选结果）</div>`
      + $("#notice").innerHTML;
    renderToolbar(window.__lastData);
  }
};
function specVisible(o) {
  if (specFilter === "all") return true;
  const ids = lastSpecs[specFilter] || [];
  return ids.includes(o.platform_id);
}
window.setSort = async (m) => {
  sortMode = m;
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.id === `tab-${m}`));
  if (m === "ai") {
    await loadAiRank();
  } else {
    renderResults(window.__lastData.offers);
  }
};

async function loadAiRank() {
  const data = window.__lastData;
  if (!data || !data.offers.length) return;
  const offers = data.offers;
  const query = window.__lastQuery;
  const tabAi = $("#tab-ai");
  if (tabAi) tabAi.textContent = "AI 评估中…";
  try {
    const resp = await fetch("/api/rank", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, offers }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || `HTTP ${resp.status}`);
    }
    aiRank = await resp.json();
  } catch (err) {
    aiRank = null;
    renderResults(offers);
    $("#notice").innerHTML = `<div class="notice err">综合排序不可用 — ${err.message}</div>`;
    if (tabAi) tabAi.textContent = "综合推荐 ✨";
    return;
  }
  if (tabAi) tabAi.textContent = "综合推荐 ✨";
  renderResults(offers);
  if (aiRank.summary) {
    $("#notice").innerHTML = `<div class="notice">AI 建议：${escapeHtml(aiRank.summary)}</div>`;
  }
}

function renderResults(offers) {
  if (!offers.length) {
    $("#results").innerHTML = activeFilterCount() > 0
      ? '<div class="empty">当前筛选条件下没有报价，放宽筛选试试</div>'
      : '<div class="empty">没有拿到报价（各平台 API 未配置或采集为空）</div>';
    return;
  }
  // 平台 + 规格 + 标签排除 + 价格区间（全部可叠加）
  const visible = offers.filter((o) =>
    (platformFilter === "all" || o.platform === platformFilter)
    && specVisible(o)
    && !(o.tags || []).some((t) => excludedTags.has(t))
    && (priceRange[0] == null || o.price >= priceRange[0])
    && (priceRange[1] == null || o.price <= priceRange[1]));
  if (!visible.length) {
    $("#results").innerHTML = `<div class="empty">${PLATFORM[platformFilter]?.name || ""} 没有符合条件的报价（可放宽筛选）</div>`;
    return;
  }
  const best = Math.min(...visible.map((o) => o.price));
  // AI 模式：按模型给的顺序；每条带 score/reason 标签
  let ordered = visible, aiInfo = null;
  if (sortMode === "ai" && aiRank) {
    const byIdx = new Map(aiRank.items.map((it) => [it.index, it]));
    // 从已过滤集合取（visible 与 offers 同引用），保证价格/标签/规格筛选在 AI 模式同样生效
    ordered = aiRank.items.map((it) => offers[it.index]).filter((o) => visible.includes(o));
    aiInfo = byIdx;
  }
  const card = (o, rank) => {
    const it = aiInfo ? aiInfo.get(offers.indexOf(o)) : null;
    // AI 模式：排名徽章 + 醒目分值环；rank 从 1 开始
    const rankBadge = aiInfo && rank != null
      ? `<span class="rank-badge${rank === 1 ? " first" : ""}">#${rank}</span>` : "";
    const scoreRing = it && it.score
      ? `<div class="score-ring${it.score >= 80 ? " high" : it.score >= 60 ? " mid" : " low"}">
           <span class="score-num">${it.score}</span><span class="score-unit">综合分</span>
         </div>` : "";
    const aiTags = it && it.reason
      ? `<span class="tag ai">✨ ${escapeHtml(it.reason)}</span>` : "";
    // 软规则标签（疑似二手/价格异常/销量过低）：醒目警示，可一键全局排除
    const warnTags = (o.tags || []).map((t) =>
      `<span class="tag warn" title="点击工具栏「标签」可排除所有带此标签的商品">${escapeHtml(t)}</span>`).join("");
    return `
    <div class="card ${o.price === best && !aiInfo ? "is-best" : ""} ${aiInfo && rank === 1 ? "is-best" : ""}" id="offer-${escapeHtml(o.platform)}-${escapeHtml(o.platform_id)}">
      ${rankBadge}
      ${o.image ? `<img src="${o.image}" referrerpolicy="no-referrer" loading="lazy" />` : "<img />"}
      <div class="info">
        <div class="title">${escapeHtml(o.title)}</div>
        <div class="tags">
          ${tagsOf(o, o.price === best && !aiInfo)}
          ${aiTags}
          ${warnTags}
          ${o.shop ? `<span class="shop">${escapeHtml(o.shop)}</span>` : ""}
        </div>
      </div>
      ${scoreRing}
      <div class="price-box">
        <div class="price"><span class="yen">¥</span>${o.price.toFixed(2)}</div>
        ${o.original_price && o.original_price > o.price ? `<div class="origin">¥${o.original_price.toFixed(2)}</div>` : ""}
        ${o.url ? `<a class="buy" href="${o.url}" target="_blank" rel="noopener">去购买</a>` : ""}
        <button class="fb-btn" title="标记为二手/杂牌等不相关商品，今后不再显示" onclick="markIrrelevant('${escapeHtml(o.platform)}','${escapeHtml(o.platform_id)}')">不相关</button>
      </div>
    </div>`;
  };

  $("#results").innerHTML = ordered.map((o, i) => card(o, aiInfo ? i + 1 : null)).join("");
}

function renderFiltered(removed, stats) {
  if (!removed.length) return;
  const byReason = {};
  removed.forEach((r) => (byReason[r.reason_label] ??= []).push(r));
  $("#filtered").innerHTML = `
    <div class="filtered-block">
      <button class="filtered-toggle" onclick="this.classList.toggle('open');document.getElementById('flist').classList.toggle('show')">
        <span>已过滤 ${removed.length} 条不相关结果（${Object.keys(byReason).map((k) => `${k} ${byReason[k].length}`).join(" · ")}）</span>
        <span class="arrow">▾</span>
      </button>
      <div class="filtered-list" id="flist">
        ${removed.map((r) => `
          <div class="filtered-item">
            <span class="tag reason">${r.reason_label}</span>
            <span class="f-title">${escapeHtml(r.offer.title)}</span>
            <span class="f-price">¥${r.offer.price.toFixed(2)}</span>
          </div>`).join("")}
      </div>
    </div>`;
}

window.markIrrelevant = async (platform, platformId) => {
  const el = document.getElementById(`offer-${platform}-${platformId}`);
  if (el) el.remove();
  try {
    await fetch("/api/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ platform, platform_id: platformId }),
    });
  } catch (e) { /* 已从页面移除，落库失败不影响本次浏览 */ }
};

function linkify(safeHtml) {
  // 输入须已 escapeHtml；对 URL（含被转义的 &amp;）生成可点击链接
  return safeHtml.replace(
    /(https?:\/\/[^\s<]+)/g,
    (m) => `<a class="aa-link-strong" href="${m}" target="_blank" rel="noopener">${m.length > 52 ? m.slice(0, 50) + "…" : m}</a>`
  );
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[c]);
}

</script>
